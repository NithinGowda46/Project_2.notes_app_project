apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NithinGowda46/Project_2.notes_app_project.git
    targetRevision: main
    path: k8's
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true